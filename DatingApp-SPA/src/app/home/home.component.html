<div class="container mt-5">
  @if (!registerMode()) {
    <div class="text-center">
      <h1>Find your match</h1>
      <p class="lead">Come on in to view your matches... All you need to do is sign up!</p>
      <button class="btn btn-primary btn-lg me-2" type="button" (click)="registerMode.set(true)">Register</button>
    </div>
  } @else {
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <app-register (cancelRegister)="registerMode.set(false)" />
      </div>
    </div>
  }
</div>
