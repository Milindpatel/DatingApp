<div class="card mb-4">
  <div class="card-img-wrapper">
    <img class="card-img-top" [src]="user().photoUrl || defaultPhoto" [alt]="user().knownAs" />
    <ul class="list-inline member-icons animate text-center">
      <li class="list-inline-item">
        <a class="btn btn-primary" [routerLink]="['/members', user().id]" [attr.aria-label]="'View ' + user().knownAs">
          <i class="fa-solid fa-user"></i>
        </a>
      </li>
      <li class="list-inline-item">
        <button type="button" class="btn btn-primary" aria-label="Like"><i class="fa-solid fa-heart"></i></button>
      </li>
      <li class="list-inline-item">
        <button type="button" class="btn btn-primary" aria-label="Message"><i class="fa-solid fa-envelope"></i></button>
      </li>
    </ul>
  </div>
  <div class="card-body p-1">
    <h6 class="card-title text-center mb-1"><i class="fa-solid fa-user"></i> {{ user().knownAs }}, {{ user().age }}</h6>
    <p class="card-text text-muted text-center">{{ user().city }}</p>
  </div>
</div>
