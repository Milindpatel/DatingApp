<nav class="navbar navbar-expand-md navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" routerLink="/">Dating App</a>

    <button class="navbar-toggler" type="button" aria-label="Toggle navigation"
      [attr.aria-expanded]="navOpen()" (click)="navOpen.set(!navOpen())">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="navOpen()">
      @if (authService.loggedIn()) {
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" routerLink="/members" routerLinkActive="active">Matches</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/lists" routerLinkActive="active">Lists</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="/messages" routerLinkActive="active">Messages</a></li>
        </ul>

        <div class="dropdown">
          <img class="me-2 rounded" [src]="authService.photoUrl()" alt="" />
          <button type="button" class="btn btn-link dropdown-toggle text-light text-decoration-none"
            [attr.aria-expanded]="menuOpen()" (click)="toggleMenu($event)">
            Welcome {{ authService.decodedToken()?.unique_name | titlecase }}
          </button>
          <div class="dropdown-menu dropdown-menu-end mt-2" [class.show]="menuOpen()">
            <a class="dropdown-item" routerLink="/member/edit"><i class="fa-solid fa-user"></i> Edit profile</a>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item" (click)="logout()">
              <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
          </div>
        </div>
      } @else {
        <form #loginForm="ngForm" class="d-flex gap-2 ms-auto my-2 my-md-0" (ngSubmit)="login()">
          <input class="form-control" type="text" name="username" placeholder="Username" autocomplete="username"
            aria-label="Username" required [(ngModel)]="model.username" />
          <input class="form-control" type="password" name="password" placeholder="Password"
            autocomplete="current-password" aria-label="Password" required [(ngModel)]="model.password" />
          <button [disabled]="!loginForm.valid" class="btn btn-success" type="submit">Login</button>
        </form>
      }
    </div>
  </div>
</nav>
