name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build DatingApp.slnx
      - run: dotnet test --solution DatingApp.slnx --no-build

  spa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DatingApp-SPA
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: DatingApp-SPA/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
